name: Saudi Market Scanner

on:
  workflow_dispatch:
  schedule:
    # يعمل كل 30 دقيقة من 10:00 صباحاً حتى 3:30 مساءً بتوقيت السعودية (7:00 إلى 12:30 UTC)
    - cron: '0,30 7-12 * * 0,1,2,3,4'
    # تشغيل أخير الساعة 16:00 تماماً بتوقيت السعودية (13:00 UTC) عند إغلاق السوق
    - cron: '0 13 * * 0,1,2,3,4'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Market Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python main.py

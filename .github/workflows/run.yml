name: squeeze-bot

on:
  schedule:
    # التوقيت بالـ UTC (الرياض = UTC+3) | الأحد - الخميس
    - cron: "20 4 * * 0-4"          # 07:20 الرياض - فحص واحد قبل الافتتاح
    - cron: "45-55/5 6 * * 0-4"     # 09:45 - 09:55 الرياض
    - cron: "*/5 7-11 * * 0-4"      # 10:00 - 14:55 الرياض
    - cron: "0-20/5 12 * * 0-4"     # 15:00 - 15:20 الرياض
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run squeeze bot
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save seen signals
        run: |
          git config user.name "squeeze-bot"
          git config user.email "squeeze-bot@users.noreply.github.com"
          git add seen_squeeze.json || true
          git commit -m "update seen signals" || true
          git push || true

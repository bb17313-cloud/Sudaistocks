name: Saudi Market Scanner

on:
  workflow_dispatch: # للتشغيل اليدوي
  schedule:
    # 07:00 UTC = 10:00 AM بتوقيت السعودية
    # 12:30 UTC = 15:30 PM بتوقيت السعودية (آخر فحص قبل 15:40)
    # Days 0-4: الأحد إلى الخميس
    - cron: '0,30 7-12 * * 0,1,2,3,4'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Market Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python main.py
